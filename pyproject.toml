[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "volsurf"
version = "0.2.0"
description = "SVI/SSVI/xSSVI volatility surface fitting for SPY options"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Jack Templeton"}]
keywords = ["quantitative-finance", "volatility", "options", "SVI", "SSVI"]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "pyarrow>=14.0",
    "matplotlib>=3.7",
    "joblib>=1.3",
]

[project.optional-dependencies]
notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.25",
]
dev = [
    "pytest>=7.4",
    "nbstripout>=0.6",
    "ruff>=0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
